name: Repository and Backend CI

on:
  push:
    branches: [ main, feature/**, fix/**, refactor/**, experiment/**, docs/**, codex/** ]
  pull_request:
    branches: [ main ]

jobs:
  validate-foundation:
    name: Validate Repository Foundation & Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Repository Structure & Integrity
        run: |
          python scripts/validate_repo.py

      - name: Check for Uncommitted Secrets & Sensitive Files
        run: |
          # Verify .env is not tracked; local ignored env is allowed.
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "ERROR: .env file found in repository! Real secrets must never be committed."
            exit 1
          fi
          echo "Secret check passed: No .env committed."

      - name: Verify Docker Compose Configuration Syntax
        run: |
          docker compose config -q
          echo "docker-compose.yml syntax is valid."

  backend:
    name: Catalog, Identity and PostgreSQL Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinic_test
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_DB: clinic_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U clinic_test -d clinic_test"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://clinic_test:synthetic_test_password@localhost:55432/clinic_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend and test tools
        run: python -m pip install -e '.[dev]'
      - name: Check lint, formatting and types
        run: |
          python -m ruff check services/clinic-backend/src packages/schemas/src tests/unit tests/integration database/migrations
          python -m black --check services/clinic-backend/src packages/schemas/src tests/unit tests/integration database/migrations
          python -m mypy
      - name: Patient frontend auth tests
        run: node --test tests/frontend/portal-auth.test.cjs
      - name: Unit and real PostgreSQL integration tests
        run: python -m pytest -q
      - name: Build backend image
        run: docker compose --profile backend build clinic-backend
      - name: Container migration and bilingual smoke test
        run: |
          docker compose up -d database
          python scripts/setup_identity_dev.py
          docker compose up -d mailpit
          docker compose --profile backend run --rm clinic-backend python -m alembic upgrade head
          docker compose --profile backend run --rm clinic-backend python -m clinic_backend.seed
          docker compose --profile backend up -d clinic-backend
          curl --retry 10 --retry-delay 2 --retry-all-errors --fail http://localhost:8000/api/v1/health/ready
          curl --fail --get --data-urlencode 'q=قلب' http://localhost:8000/api/v1/doctors
          python scripts/smoke_identity.py
          python scripts/smoke_availability.py
      - name: Stop containers
        if: always()
        run: docker compose --profile backend down
