  #     - "8001:8001"
  #   environment:
  #     - CLINIC_API_BASE_URL=http://clinic-backend:8000/api/v1
  #     - RAG_SERVICE_URL=http://rag:8002/api/v1
  #     - LLM_PROVIDER=${LLM_PROVIDER}
  #     - LLM_API_KEY=${LLM_API_KEY}
  #   depends_on:
  #     - clinic-backend

  # rag:
  #   build:
  #     context: .
  #     dockerfile: services/rag/Dockerfile
  #   container_name: agentic_clinic_rag
  #   restart: unless-stopped
  #   ports:
  #     - "8002:8002"
  #   environment:
  #     - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER}
  #     - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}

  # voice:
  #   build:
