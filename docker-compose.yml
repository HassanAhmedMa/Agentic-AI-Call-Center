# ==============================================================================
# Agentic Clinic - Docker Compose Foundation (Phase 0)
#
# ARCHITECTURAL NOTE:
# During Phase 0 (Architecture & Foundation), application services (clinic-backend,
# ai-agent, rag, voice) are defined as architecture contracts.
#
# Below, shared persistence infrastructure (PostgreSQL & Redis) is configured
# for local development. Service containers are declared and documented as
# blueprints to be un-commented as service implementations land in Phase 1+.
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Shared Database: PostgreSQL (Relational persistence for Clinic Backend)
  # ----------------------------------------------------------------------------
  database:
    image: postgres:16-alpine
    container_name: agentic_clinic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinic_password}
      POSTGRES_DB: ${POSTGRES_DB:-clinic_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_user -d clinic_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Shared Cache & Session Store: Redis
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: agentic_clinic_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

