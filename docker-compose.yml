# ==============================================================================
# Agentic Clinic - Local Infrastructure and Phase 1 Catalog
#
# ARCHITECTURAL NOTE:
# The catalog backend is opt-in with --profile backend. Other application
# services remain architecture blueprints until their implementation lands.
#
# Below, shared persistence infrastructure (PostgreSQL & Redis) is configured
# for local development. Service containers are declared and documented as
# blueprints to be un-commented as service implementations land in Phase 1+.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Shared Database: PostgreSQL (Relational persistence for Clinic Backend)
  # ----------------------------------------------------------------------------
  database:
    image: postgres:16-alpine
    container_name: agentic_clinic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinic_password}
      POSTGRES_DB: ${POSTGRES_DB:-clinic_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Shared Cache & Session Store: Redis
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: agentic_clinic_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Local synthetic email inbox only. Do not expose it through the public tunnel.
  mailpit:
    image: axllent/mailpit:v1.27.4
    container_name: agentic_clinic_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  clinic-backend:
    profiles: [backend]
    build:
      context: .
      dockerfile: services/clinic-backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-clinic_user}:${POSTGRES_PASSWORD:-clinic_password}@database:5432/${POSTGRES_DB:-clinic_db}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=6)"]
      interval: 10s
      timeout: 7s
      retries: 5

  # ============================================================================
  # FUTURE APPLICATION SERVICES (To be activated in Phase 1+)
