[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-clinic-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.0", "uvicorn==0.54.0", "websockets==17.2", "sqlalchemy[asyncio]==2.0.54",
  "asyncpg==0.32.0", "alembic==1.20.0", "pydantic==2.14.0",
  "pydantic-settings==2.15.0",
  "tzdata==2026.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "httpx==0.28.1",
       "ruff==0.17.0", "black==26.10.1", "mypy==1.20.2"]

[tool.setuptools.packages.find]
where = ["services/clinic-backend/src", "packages/schemas/src"]

[tool.setuptools.package-data]
clinic_backend = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["services/clinic-backend/src", "packages/schemas/src"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider --import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
target-version = ["py311"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
strict = true
mypy_path = "services/clinic-backend/src,packages/schemas/src"
files = ["services/clinic-backend/src", "packages/schemas/src"]
